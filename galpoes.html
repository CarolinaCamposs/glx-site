<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galpões | GLX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <a class="logo" href="index.html">
      GLX <span>Galpões Logísticos Express</span>
    </a>

    <nav>
      <a href="index.html">Início</a>
      <a href="galpoes.html">Galpões</a>
    </nav>
  </header>

  <main class="pagina-galpoes">
    <p class="etiqueta">IMÓVEIS GLX</p>
    <h1>Galpões disponíveis</h1>

    <section class="lista-galpoes" id="lista-galpoes">
      <article class="item-galpao">
        <span class="etiqueta">EXEMPLO DEMONSTRATIVO</span>
        <h2>Galpão exemplo</h2>
        <p>Os dados e a foto de um imóvel real aparecerão aqui.</p>
        <a class="link-detalhes" href="galpao-exemplo.html">Ver mais detalhes →</a>
      </article>
    </section>
  </main>
  <script src="dados-galpoes.js"></script>
<script>
  const lista = document.querySelector("#lista-galpoes");

  galpoes.forEach(function (galpao) {
    const cartao = document.createElement("article");
    cartao.className = "item-galpao";

    const nome = document.createElement("h2");
    nome.textContent = galpao.nome;

    const local = document.createElement("p");
    local.textContent = `${galpao.cidade} / ${galpao.uf}`;

    const link = document.createElement("a");
    link.className = "link-detalhes";
    link.href = `detalhes.html?id=${encodeURIComponent(galpao.id)}`;
    link.textContent = "Ver mais detalhes →";

    cartao.append(nome, local, link);
    lista.append(cartao);
  });
</script>
</body>
</html>
