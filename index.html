<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GLX | Galpões Logísticos Express</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="cabecalho">
      <a class="logo" href="index.html">
        GLX <span>Galpões Logísticos Express</span>
      </a>

      <button
        class="botao-menu"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="menu-principal"
      >
        ☰
      </button>

      <nav id="menu-principal" class="menu-principal">
        <a href="index.html">Início</a>
        <a href="galpoes.html">Galpões</a>
        <a href="#rodape-site">Contato</a>
      </nav>
    </header>

    <main>
      <section class="banner">
        <p>GLX · GALPÕES LOGÍSTICOS EXPRESS</p>
        <h1>O espaço para a sua próxima grande operação.</h1>
        <a href="#galpoes">Conhecer os galpões →</a>
      </section>

      <section id="galpoes" class="imoveis">
        <div class="titulo-secao">
          <p>OPORTUNIDADES GLX</p>
          <h2>Galpão em destaque</h2>
        </div>

        <div id="galpao-destaque"></div>

        <div class="titulo-secao outros-titulo">
          <p>CONHEÇA MAIS ESPAÇOS</p>
          <h2>Outros galpões</h2>
        </div>

        <div class="grade-galpoes" id="outros-galpoes"></div>

        <a class="ver-todos" href="galpoes.html"> Ver todos os galpões → </a>
      </section>
    </main>

    <footer id="rodape-site"></footer>

    <script src="contato.js"></script>
    <script src="dados-galpoes.js"></script>
    <script src="rodape.js"></script>

    <script>
      const areaDestaque = document.querySelector("#galpao-destaque");
      const areaOutros = document.querySelector("#outros-galpoes");

      function elemento(tag, classe, texto) {
        const item = document.createElement(tag);
        if (classe) item.className = classe;
        if (texto) item.textContent = texto;
        return item;
      }

      function criarImagem(galpao, classe) {
        const caixa = elemento("div", classe);

        if (galpao.imagem) {
          const foto = elemento("img");
          foto.src = galpao.imagem;
          foto.alt = `Foto de ${galpao.nome}`;
          foto.addEventListener("error", () => {
            caixa.replaceChildren(elemento("span", "", "GLX"));
          });
          caixa.append(foto);
        } else {
          caixa.append(elemento("span", "", "GLX"));
        }

        return caixa;
      }

      function criarLink(galpao) {
        const link = elemento("a", "link-detalhes", "Ver mais detalhes →");
        link.href = `detalhes.html?id=${encodeURIComponent(galpao.id)}`;
        return link;
      }

      if (galpoes.length === 0) {
        areaDestaque.append(
          elemento("p", "", "Novos galpões aparecerão aqui em breve."),
        );
      } else {
        const destaque =
          galpoes.find((galpao) => galpao.id === "betim-business") ||
          galpoes[0];

        const artigo = elemento("article", "destaque");
        const conteudo = elemento("div", "conteudo-destaque");

        conteudo.append(
          elemento("span", "etiqueta", "GALPÃO EM DESTAQUE"),
          elemento("h3", "", destaque.nome),
          elemento("p", "", `${destaque.cidade} / ${destaque.uf}`),
          elemento("p", "", destaque.descricao),
          criarLink(destaque),
        );

        artigo.append(criarImagem(destaque, "imagem-imovel"), conteudo);
        areaDestaque.append(artigo);

        const outros = galpoes
          .filter((galpao) => galpao.id !== destaque.id)
          .slice(0, 3);

        outros.forEach((galpao) => {
          const cartao = elemento("article", "cartao");
          const conteudoCartao = elemento("div", "conteudo-cartao");

          conteudoCartao.append(
            elemento("h3", "", galpao.nome),
            elemento("p", "", `${galpao.cidade} / ${galpao.uf}`),
            criarLink(galpao),
          );

          cartao.append(criarImagem(galpao, "imagem-cartao"), conteudoCartao);
          areaOutros.append(cartao);
        });

        if (outros.length === 0) {
          areaOutros.append(
            elemento("p", "", "Outros galpões aparecerão aqui em breve."),
          );
        }
      }
    </script>
    <script>
      const botaoMenu = document.querySelector(".botao-menu");
      const menuPrincipal = document.querySelector(".menu-principal");

      botaoMenu.addEventListener("click", () => {
        const aberto = menuPrincipal.classList.toggle("aberto");
        botaoMenu.setAttribute("aria-expanded", String(aberto));
        botaoMenu.setAttribute(
          "aria-label",
          aberto ? "Fechar menu" : "Abrir menu",
        );
        botaoMenu.textContent = aberto ? "✕" : "☰";
      });
    </script>
  </body>
</html>
