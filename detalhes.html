<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalhes do galpão | GLX</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="cabecalho">
      <a class="logo" href="index.html">
        GLX <span>Galpões Logísticos Express</span>
      </a>

      <nav>
        <a href="index.html">Início</a>
        <a href="galpoes.html">Galpões</a>
      </nav>
    </header>

    <main class="pagina-detalhes">
      <a class="voltar-galpoes" href="galpoes.html">← Voltar aos galpões</a>
      <div id="conteudo-galpao"></div>
    </main>

    <footer id="rodape-site"></footer>

    <script src="contato.js"></script>
    <script src="dados-galpoes.js"></script>
    <script src="rodape.js"></script>

    <script>
      const id = new URLSearchParams(window.location.search).get("id");
      const galpao = galpoes.find((item) => item.id === id);
      const conteudo = document.querySelector("#conteudo-galpao");

      function criar(tag, classe, texto) {
        const elemento = document.createElement(tag);
        if (classe) elemento.className = classe;
        if (texto) elemento.textContent = texto;
        return elemento;
      }

      if (!galpao) {
        conteudo.append(criar("h1", "", "Galpão não encontrado"));
      } else {
        document.title = `${galpao.nome} | GLX`;

        const apresentacao = criar("section", "detalhe-apresentacao");
        apresentacao.append(
          criar("p", "detalhe-etiqueta", "GALPÕES LOGÍSTICOS EXPRESS"),
          criar("h1", "", galpao.nome),
          criar("p", "detalhe-local", `${galpao.cidade} / ${galpao.uf}`),
        );

        const fotoBox = criar("div", "detalhe-foto");

        if (galpao.imagem) {
          const foto = criar("img");
          foto.src = galpao.imagem;
          foto.alt = `Foto de ${galpao.nome}`;
          foto.addEventListener("error", () => {
            fotoBox.replaceChildren(
              criar("span", "", "Imagem do imóvel em breve"),
            );
          });
          fotoBox.append(foto);
        } else {
          fotoBox.append(criar("span", "", "Imagem do imóvel em breve"));
        }

        const dados = criar("section", "detalhe-dados");

        function adicionarDado(rotulo, valor) {
          if (!valor) return;

          const cartao = criar("div", "detalhe-dado");
          cartao.append(criar("span", "", rotulo), criar("strong", "", valor));
          dados.append(cartao);
        }

        adicionarDado("ÁREA", galpao.area);
        adicionarDado("FINALIDADE", galpao.finalidade);
        adicionarDado("DISPONIBILIDADE", galpao.disponibilidade);
        adicionarDado("MÓDULOS", galpao.modulos);

        const informacoes = criar("div", "detalhe-informacoes");
        const chamada = criar("div", "detalhe-chamada");
        const numero = contatoGLX.whatsapp.replace(/\D/g, "");

        if (numero) {
          const botao = criar(
            "a",
            "detalhe-botao",
            "Consultar este galpão pelo WhatsApp ↗",
          );

          botao.href =
            `https://wa.me/${numero}?text=` +
            encodeURIComponent(
              `Olá! Gostaria de saber mais sobre o imóvel ${galpao.nome}.`,
            );

          botao.target = "_blank";
          botao.rel = "noopener noreferrer";
          chamada.append(botao);
        }

        const sobre = criar("section", "detalhe-sobre");
        sobre.append(
          criar("p", "detalhe-etiqueta", "CONHEÇA O IMÓVEL"),
          criar("h2", "", "Sobre o galpão"),
          criar("p", "", galpao.descricao),
        );

        if (galpao.valor) {
          sobre.append(criar("p", "detalhe-valor", `Valor: ${galpao.valor}`));
        }

        informacoes.append(sobre);

        if (galpao.caracteristicas?.length) {
          const especificacoes = criar("section", "detalhe-especificacoes");
          especificacoes.append(
            criar("p", "detalhe-etiqueta", "ESTRUTURA"),
            criar("h2", "", "Características"),
          );

          const lista = criar("ul");

          galpao.caracteristicas.forEach((caracteristica) => {
            lista.append(criar("li", "", caracteristica));
          });

          especificacoes.append(lista);
          informacoes.append(especificacoes);
        }

        const contato = criar("section", "detalhe-contato");
        contato.append(
          criar("p", "detalhe-etiqueta", "FALE COM A GLX"),
          criar("h2", "", "Interessou por este imóvel?"),
        );

        const botoes = criar("div", "acoes-contato");
        adicionarAcoesContato(botoes, galpao.nome);
        contato.append(botoes);
        const fotosGaleria = [galpao.imagem, ...(galpao.fotos || [])].filter(
          Boolean,
        );

        const galeria = criar("section", "galeria-imovel");

        if (fotosGaleria.length > 1) {
          galeria.append(
            criar("p", "detalhe-etiqueta", "GALERIA"),
            criar("h2", "", "Veja mais fotos"),
          );

          const visualizador = criar("div", "galeria-visualizador");
          const foto = criar("img");
          const anterior = criar("button", "galeria-seta", "←");
          const proxima = criar("button", "galeria-seta", "→");
          const contador = criar("p", "galeria-contador");

          anterior.type = "button";
          anterior.setAttribute("aria-label", "Foto anterior");
          proxima.type = "button";
          proxima.setAttribute("aria-label", "Próxima foto");
          contador.setAttribute("aria-live", "polite");

          let indice = 0;

          function mostrarFoto() {
            foto.src = fotosGaleria[indice];
            foto.alt = `Foto ${indice + 1} de ${fotosGaleria.length} — ${galpao.nome}`;
            contador.textContent = `${indice + 1} / ${fotosGaleria.length}`;
          }

          anterior.addEventListener("click", () => {
            indice = (indice - 1 + fotosGaleria.length) % fotosGaleria.length;
            mostrarFoto();
          });

          proxima.addEventListener("click", () => {
            indice = (indice + 1) % fotosGaleria.length;
            mostrarFoto();
          });

          mostrarFoto();
          visualizador.append(anterior, foto, proxima);
          galeria.append(visualizador, contador);
        }
        conteudo.append(apresentacao, fotoBox, dados, informacoes);

        if (fotosGaleria.length > 1) {
          conteudo.append(galeria);
        }

        conteudo.append(chamada);
      }
    </script>
  </body>
</html>
